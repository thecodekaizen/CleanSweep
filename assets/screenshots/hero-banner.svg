<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyanGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="75%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182234" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e1626" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2c42" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#141d2e" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Primary Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Window Shadow -->
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.15"/>
    </filter>

    <clipPath id="windowClip">
      <rect x="100" y="50" width="1000" height="580" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <rect width="1200" height="680" fill="url(#cyanGlow)"/>
  <rect width="1200" height="680" fill="url(#indigoGlow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="680"/>
    <line x1="400" y1="0" x2="400" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="800" y1="0" x2="800" y2="680"/>
    <line x1="1000" y1="0" x2="1000" y2="680"/>
  </g>

  <!-- macOS Window Frame -->
  <g filter="url(#winShadow)">
    <rect x="100" y="50" width="1000" height="580" rx="16" ry="16" fill="url(#windowGlass)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  </g>

  <!-- Window Contents (Clipped) -->
  <g clip-path="url(#windowClip)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif">
    
    <!-- Titlebar / Header -->
    <rect x="100" y="50" width="1000" height="52" fill="#0f172a" fill-opacity="0.6"/>
    <line x1="100" y1="102" x2="1100" y2="102" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="128" cy="76" r="6" fill="#ff5f56"/>
    <circle cx="148" cy="76" r="6" fill="#ffbd2e"/>
    <circle cx="168" cy="76" r="6" fill="#27c93f"/>

    <!-- Titlebar App Badge -->
    <text x="210" y="81" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.3">CleanSweep</text>
    <rect x="295" y="68" width="56" height="18" rx="9" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="323" y="81" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">PRO</text>

    <!-- Top Telemetry Strip -->
    <g transform="translate(680, 68)" font-size="11">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#1e293b" fill-opacity="0.7"/>
      <circle cx="10" cy="10" r="3" fill="#38bdf8"/>
      <text x="20" y="14" fill="#94a3b8">CPU: <tspan fill="#f1f5f9" font-weight="600">6%</tspan></text>

      <rect x="130" y="0" width="135" height="20" rx="4" fill="#1e293b" fill-opacity="0.7"/>
      <circle cx="140" cy="10" r="3" fill="#10b981"/>
      <text x="150" y="14" fill="#94a3b8">RAM: <tspan fill="#f1f5f9" font-weight="600">14.2 GB Free</tspan></text>

      <rect x="275" y="0" width="130" height="20" rx="4" fill="#1e293b" fill-opacity="0.7"/>
      <circle cx="285" cy="10" r="3" fill="#6366f1"/>
      <text x="295" y="14" fill="#94a3b8">Disk: <tspan fill="#f1f5f9" font-weight="600">140 GB Free</tspan></text>
    </g>

    <!-- ================= SIDEBAR ================= -->
    <rect x="100" y="102" width="220" height="528" fill="#0b1120" fill-opacity="0.5"/>
    <line x1="320" y1="102" x2="320" y2="630" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Sidebar Section: Cleaning -->
    <text x="124" y="132" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.8">CLEANING</text>

    <!-- Sidebar Active Item: Smart Clean -->
    <rect x="112" y="144" width="196" height="34" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="144" y="166" font-size="13" font-weight="600" fill="#f8fafc">Smart Clean</text>
    <circle cx="128" cy="161" r="5" fill="#38bdf8"/>
    <text x="290" y="166" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="end">31 GB</text>

    <!-- Sidebar Items -->
    <g font-size="12" fill="#94a3b8" font-weight="500">
      <text x="144" y="202">App Uninstaller</text>
      <circle cx="128" cy="198" r="4" fill="#64748b"/>

      <text x="144" y="234">Project Purger</text>
      <circle cx="128" cy="230" r="4" fill="#64748b"/>

      <text x="144" y="266">Duplicate Finder</text>
      <circle cx="128" cy="262" r="4" fill="#64748b"/>

      <text x="144" y="298">App Slimmer</text>
      <circle cx="128" cy="294" r="4" fill="#64748b"/>

      <text x="144" y="330">Installer Packages</text>
      <circle cx="128" cy="326" r="4" fill="#64748b"/>
    </g>

    <!-- Sidebar Section: Utilities -->
    <text x="124" y="372" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.8">SYSTEM &amp; STATS</text>

    <g font-size="12" fill="#94a3b8" font-weight="500">
      <text x="144" y="402">Disk Analyzer</text>
      <circle cx="128" cy="398" r="4" fill="#64748b"/>

      <text x="144" y="434">System Maintenance</text>
      <circle cx="128" cy="430" r="4" fill="#64748b"/>

      <text x="144" y="466">Startup Items</text>
      <circle cx="128" cy="462" r="4" fill="#64748b"/>

      <text x="144" y="498">Activity Monitor</text>
      <circle cx="128" cy="494" r="4" fill="#64748b"/>

      <text x="144" y="530">History &amp; Audit</text>
      <circle cx="128" cy="526" r="4" fill="#64748b"/>

      <text x="144" y="562">Preferences</text>
      <circle cx="128" cy="558" r="4" fill="#64748b"/>
    </g>

    <!-- ================= MAIN CONTENT ================= -->
    <!-- Hero Banner Card -->
    <g transform="translate(345, 122)">
      <rect width="730" height="110" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      
      <!-- Sparkle Icon -->
      <circle cx="50" cy="55" r="28" fill="#0284c7" fill-opacity="0.25"/>
      <path d="M50 38 L54 49 L65 53 L54 57 L50 68 L46 57 L35 53 L46 49 Z" fill="#38bdf8"/>

      <text x="95" y="48" font-size="19" font-weight="700" fill="#ffffff">Smart Clean Ready</text>
      <text x="95" y="70" font-size="13" fill="#94a3b8">Scan finished in 182ms. Found <tspan fill="#38bdf8" font-weight="600">31.33 GB</tspan> of safe reclaimable caches.</text>
      <text x="95" y="88" font-size="11" fill="#64748b">Protected by macOS trash-first deletion safety guarantee</text>

      <!-- Clean Button -->
      <rect x="560" y="35" width="145" height="40" rx="10" fill="url(#btnGrad)"/>
      <text x="632" y="60" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Clean 31.33 GB</text>
    </g>

    <!-- Category Columns Grid -->
    <!-- Card 1: System Junk -->
    <g transform="translate(345, 248)">
      <rect width="232" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="34" y="39" font-size="16" text-anchor="middle" fill="#60a5fa">🖥️</text>
      <text x="62" y="32" font-size="14" font-weight="600" fill="#ffffff">System &amp; Apps</text>
      <text x="62" y="47" font-size="11" fill="#64748b">Caches &amp; logs</text>

      <text x="16" y="85" font-size="22" font-weight="700" fill="#38bdf8">6.49 GB</text>
      <text x="16" y="103" font-size="11" fill="#94a3b8">User Caches: 6.49 GB</text>
      <text x="16" y="119" font-size="11" fill="#94a3b8">Diagnostic Reports: 0 B</text>
      <text x="16" y="135" font-size="11" fill="#94a3b8">Thumbnail Cache: Clean</text>
      
      <!-- Checkmark Pill -->
      <rect x="16" y="145" width="68" height="18" rx="9" fill="#10b981" fill-opacity="0.15"/>
      <text x="50" y="158" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">✓ Selected</text>
    </g>

    <!-- Card 2: Developer & Build -->
    <g transform="translate(594, 248)">
      <rect width="232" height="175" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="34" y="39" font-size="16" text-anchor="middle" fill="#fbbf24">🏗️</text>
      <text x="62" y="32" font-size="14" font-weight="600" fill="#ffffff">Developer &amp; Build</text>
      <text x="62" y="47" font-size="11" fill="#64748b">Package managers &amp; runtimes</text>

      <text x="16" y="85" font-size="22" font-weight="700" fill="#fbbf24">15.42 GB</text>
      <text x="16" y="103" font-size="11" fill="#94a3b8">npm / pnpm / Bun: 4.94 GB</text>
      <text x="16" y="119" font-size="11" fill="#94a3b8">Python uv / Pip: 3.61 GB</text>
      <text x="16" y="135" font-size="11" fill="#94a3b8">Gradle &amp; Homebrew: 3.81 GB</text>

      <!-- Checkmark Pill -->
      <rect x="16" y="145" width="68" height="18" rx="9" fill="#10b981" fill-opacity="0.15"/>
      <text x="50" y="158" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">✓ Selected</text>
    </g>

    <!-- Card 3: AI Models & Weights -->
    <g transform="translate(843, 248)">
      <rect width="232" height="175" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="34" y="39" font-size="16" text-anchor="middle" fill="#a78bfa">🤖</text>
      <text x="62" y="32" font-size="14" font-weight="600" fill="#ffffff">AI &amp; Local Models</text>
      <text x="62" y="47" font-size="11" fill="#64748b">Ollama, HuggingFace, LM</text>

      <text x="16" y="85" font-size="22" font-weight="700" fill="#c084fc">7.22 GB</text>
      <text x="16" y="103" font-size="11" fill="#94a3b8">HuggingFace Hub: 4.1 GB</text>
      <text x="16" y="119" font-size="11" fill="#94a3b8">Ollama Blobs: 3.12 GB</text>
      <text x="16" y="135" font-size="11" fill="#94a3b8">LM Studio: Clean</text>

      <!-- Checkmark Pill -->
      <rect x="16" y="145" width="68" height="18" rx="9" fill="#10b981" fill-opacity="0.15"/>
      <text x="50" y="158" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">✓ Selected</text>
    </g>

    <!-- Bottom Row: Browsers & Containers -->
    <!-- Card 4: Browsers -->
    <g transform="translate(345, 438)">
      <rect width="356" height="165" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="34" y="39" font-size="16" text-anchor="middle" fill="#34d399">🌐</text>
      <text x="62" y="32" font-size="14" font-weight="600" fill="#ffffff">Web Browsers</text>
      <text x="62" y="47" font-size="11" fill="#64748b">Chrome, Arc, Safari, Edge, Firefox</text>

      <text x="16" y="85" font-size="22" font-weight="700" fill="#34d399">2.20 GB</text>
      <text x="16" y="106" font-size="12" fill="#94a3b8">Chrome: <tspan fill="#f1f5f9">1.40 GB</tspan> | Arc: <tspan fill="#f1f5f9">804 MB</tspan> | Safari: <tspan fill="#f1f5f9">22 MB</tspan></text>
      <text x="16" y="126" font-size="11" fill="#64748b">Preserves cookies, active logins, history, and bookmarks</text>
    </g>

    <!-- Card 5: App Slimmer & Leftovers -->
    <g transform="translate(719, 438)">
      <rect width="356" height="165" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>
      <rect x="16" y="16" width="36" height="36" rx="8" fill="#ec4899" fill-opacity="0.2"/>
      <text x="34" y="39" font-size="16" text-anchor="middle" fill="#f472b6">✂️</text>
      <text x="62" y="32" font-size="14" font-weight="600" fill="#ffffff">App Slimmer &amp; Installers</text>
      <text x="62" y="47" font-size="11" fill="#64748b">Foreign language packs (.lproj) &amp; .dmg</text>

      <text x="16" y="85" font-size="22" font-weight="700" fill="#f472b6">42.75 MB</text>
      <text x="16" y="106" font-size="12" fill="#94a3b8">8 Apps with unneeded localization packs</text>
      <text x="16" y="126" font-size="11" fill="#64748b">Zoom (25MB), WhatsApp (14MB), Chrome (78KB)</text>
    </g>

  </g>
</svg>
