<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="100%" height="100%">
  <defs>
    <!-- macOS Window Shadow -->
    <filter id="macWindowShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <clipPath id="macWindowClip">
      <rect x="50" y="35" width="1060" height="630" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Neutral Dark Studio Canvas Background -->
  <rect width="1160" height="700" fill="#121214"/>

  <!-- Native macOS Window Frame -->
  <g filter="url(#macWindowShadow)">
    <rect x="50" y="35" width="1060" height="630" rx="12" ry="12" fill="#1e1e1e" stroke="#38383a" stroke-width="1"/>
  </g>

  <!-- Window Contents -->
  <g clip-path="url(#macWindowClip)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Helvetica Neue', sans-serif">
    
    <!-- Unified Titlebar / Toolbar (macOS Sequoia style) -->
    <rect x="50" y="35" width="1060" height="48" fill="#181818"/>
    <line x1="50" y1="83" x2="1110" y2="83" stroke="#28282a" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="74" cy="59" r="6" fill="#ff5f57" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="94" cy="59" r="6" fill="#febc2e" stroke="#d89e24" stroke-width="0.5"/>
    <circle cx="114" cy="59" r="6" fill="#28c840" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Toolbar Title & Search Bar -->
    <text x="146" y="64" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="-0.2">CleanSweep</text>

    <!-- Toolbar Search / Scope Bar -->
    <g transform="translate(730, 47)">
      <rect width="220" height="24" rx="6" fill="#242426" stroke="#333336" stroke-width="1"/>
      <path d="M12 12 l-3 -3 m3 0 a 4 4 0 1 0 -8 0 a 4 4 0 1 0 8 0" stroke="#71717a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <text x="24" y="16" font-size="11" fill="#71717a">Filter categories...</text>
    </g>

    <!-- Toolbar Quick Telemetry Pill -->
    <g transform="translate(965, 47)">
      <rect width="125" height="24" rx="6" fill="#242426" stroke="#333336" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#32d74b"/>
      <text x="22" y="16" font-size="11" font-weight="500" fill="#d4d4d8">14.2 GB Free</text>
    </g>

    <!-- ================= SIDEBAR ================= -->
    <rect x="50" y="83" width="220" height="582" fill="#161617"/>
    <line x1="270" y1="83" x2="270" y2="665" stroke="#28282a" stroke-width="1"/>

    <!-- Section: Clean -->
    <text x="70" y="112" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.5">CLEANUP</text>

    <!-- Active Item: Smart Clean (Native macOS List Selection) -->
    <rect x="62" y="124" width="196" height="30" rx="6" fill="#0a84ff"/>
    <path d="M78 135 l6 6 l-4 4 m-2 -2 l-4 -4" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text x="96" y="144" font-size="12" font-weight="500" fill="#ffffff">Smart Clean</text>
    <text x="246" y="144" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.8" text-anchor="end">31.3 GB</text>

    <!-- Navigation Items -->
    <g font-size="12" fill="#a1a1aa" font-weight="400">
      <!-- App Uninstaller -->
      <g transform="translate(62, 160)">
        <text x="34" y="19">App Uninstaller</text>
        <rect x="14" y="9" width="12" height="12" rx="2" stroke="#71717a" stroke-width="1.2" fill="none"/>
      </g>

      <!-- Project Purger -->
      <g transform="translate(62, 192)">
        <text x="34" y="19">Project Purger</text>
        <path d="M14 11 h12 v10 h-12 z M17 11 v-2 h6 v2" stroke="#71717a" stroke-width="1.2" fill="none"/>
      </g>

      <!-- Duplicate Finder -->
      <g transform="translate(62, 224)">
        <text x="34" y="19">Duplicate Finder</text>
        <rect x="14" y="9" width="9" height="11" rx="1.5" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <rect x="18" y="12" width="9" height="11" rx="1.5" stroke="#71717a" stroke-width="1.2" fill="none"/>
      </g>

      <!-- App Slimmer -->
      <g transform="translate(62, 256)">
        <text x="34" y="19">App Slimmer</text>
        <circle cx="17" cy="17" r="2.5" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <circle cx="23" cy="17" r="2.5" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <path d="M18 15 l4 -5 m-4 0 l4 5" stroke="#71717a" stroke-width="1.2"/>
      </g>

      <!-- Installer Packages -->
      <g transform="translate(62, 288)">
        <text x="34" y="19">Installers (.dmg)</text>
        <circle cx="20" cy="16" r="6" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <circle cx="20" cy="16" r="2" fill="#71717a"/>
      </g>
    </g>

    <!-- Section: System & Tools -->
    <text x="70" y="348" font-size="10" font-weight="600" fill="#71717a" letter-spacing="0.5">SYSTEM</text>

    <g font-size="12" fill="#a1a1aa" font-weight="400">
      <g transform="translate(62, 360)">
        <text x="34" y="19">Disk Analyzer</text>
        <circle cx="20" cy="16" r="5.5" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <path d="M20 16 l3 -2" stroke="#71717a" stroke-width="1.2"/>
      </g>

      <g transform="translate(62, 392)">
        <text x="34" y="19">Maintenance</text>
        <path d="M19 10 l-3 7 h4 l-1 6 l5 -8 h-4 z" stroke="#71717a" stroke-width="1.2" fill="none"/>
      </g>

      <g transform="translate(62, 424)">
        <text x="34" y="19">Startup Items</text>
        <path d="M16 21 v-4 a4 4 0 0 1 8 0 v4 z" stroke="#71717a" stroke-width="1.2" fill="none"/>
      </g>

      <g transform="translate(62, 456)">
        <text x="34" y="19">Activity Monitor</text>
        <path d="M13 16 h3 l2 -4 l3 8 l2 -4 h3" stroke="#71717a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(62, 488)">
        <text x="34" y="19">Cleanup History</text>
        <circle cx="20" cy="16" r="5.5" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <path d="M20 13 v3 h3" stroke="#71717a" stroke-width="1.2"/>
      </g>

      <g transform="translate(62, 520)">
        <text x="34" y="19">Preferences</text>
        <circle cx="20" cy="16" r="3" stroke="#71717a" stroke-width="1.2" fill="none"/>
        <circle cx="20" cy="16" r="6" stroke="#71717a" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
      </g>
    </g>

    <!-- Sidebar Bottom: Status -->
    <g transform="translate(70, 620)">
      <circle cx="6" cy="6" r="3.5" fill="#32d74b"/>
      <text x="16" y="10" font-size="11" font-weight="500" fill="#a1a1aa">Zero Telemetry Active</text>
    </g>

    <!-- ================= MAIN CONTENT PANE ================= -->
    <rect x="270" y="83" width="840" height="582" fill="#1e1e1e"/>

    <!-- Header Summary Block -->
    <g transform="translate(305, 110)">
      <text x="0" y="24" font-size="20" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Smart Clean</text>
      <text x="0" y="44" font-size="13" fill="#8e8e93">Scan completed. 15 items selected across system, developer, and application caches.</text>

      <!-- Primary Action Button (Native macOS Blue Fill) -->
      <g transform="translate(635, 8)">
        <rect width="135" height="34" rx="6" fill="#0a84ff"/>
        <text x="67" y="22" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Clean 31.33 GB</text>
      </g>
    </g>

    <!-- Target Category List / Table -->
    <g transform="translate(305, 180)">
      <!-- Table Header -->
      <rect width="770" height="28" rx="4" fill="#242426"/>
      <text x="16" y="18" font-size="11" font-weight="600" fill="#71717a">CATEGORY &amp; TARGETS</text>
      <text x="490" y="18" font-size="11" font-weight="600" fill="#71717a">LOCATION</text>
      <text x="750" y="18" font-size="11" font-weight="600" fill="#71717a" text-anchor="end">RECLAIMABLE</text>

      <!-- Row 1: System Caches -->
      <g transform="translate(0, 36)">
        <rect width="770" height="52" rx="6" fill="#242426" stroke="#2d2d30" stroke-width="1"/>
        <rect x="16" y="18" width="16" height="16" rx="4" fill="#0a84ff"/>
        <path d="M20 26 l2.5 2.5 l5 -5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="28" font-size="13" font-weight="500" fill="#ffffff">User Application Caches</text>
        <text x="44" y="42" font-size="11" fill="#71717a">Cached data, temporary files, and WebKit storage</text>
        <text x="490" y="32" font-size="11" font-family="monospace" fill="#8e8e93">~/Library/Caches</text>
        <text x="754" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">6.49 GB</text>
      </g>

      <!-- Row 2: Developer npm -->
      <g transform="translate(0, 96)">
        <rect width="770" height="52" rx="6" fill="#242426" stroke="#2d2d30" stroke-width="1"/>
        <rect x="16" y="18" width="16" height="16" rx="4" fill="#0a84ff"/>
        <path d="M20 26 l2.5 2.5 l5 -5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="28" font-size="13" font-weight="500" fill="#ffffff">npm Global Cache</text>
        <text x="44" y="42" font-size="11" fill="#71717a">Content-addressable tarball and index cache (_cacache)</text>
        <text x="490" y="32" font-size="11" font-family="monospace" fill="#8e8e93">~/.npm/_cacache</text>
        <text x="754" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">4.94 GB</text>
      </g>

      <!-- Row 3: Python uv / pip -->
      <g transform="translate(0, 156)">
        <rect width="770" height="52" rx="6" fill="#242426" stroke="#2d2d30" stroke-width="1"/>
        <rect x="16" y="18" width="16" height="16" rx="4" fill="#0a84ff"/>
        <path d="M20 26 l2.5 2.5 l5 -5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="28" font-size="13" font-weight="500" fill="#ffffff">uv Python Package Cache</text>
        <text x="44" y="42" font-size="11" fill="#71717a">Prebuilt wheels and zip archives</text>
        <text x="490" y="32" font-size="11" font-family="monospace" fill="#8e8e93">~/.cache/uv</text>
        <text x="754" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">3.05 GB</text>
      </g>

      <!-- Row 4: Gradle Build Daemon -->
      <g transform="translate(0, 216)">
        <rect width="770" height="52" rx="6" fill="#242426" stroke="#2d2d30" stroke-width="1"/>
        <rect x="16" y="18" width="16" height="16" rx="4" fill="#0a84ff"/>
        <path d="M20 26 l2.5 2.5 l5 -5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="28" font-size="13" font-weight="500" fill="#ffffff">Gradle Build Cache</text>
        <text x="44" y="42" font-size="11" fill="#71717a">Downloaded artifacts and compilation cache</text>
        <text x="490" y="32" font-size="11" font-family="monospace" fill="#8e8e93">~/.gradle/caches</text>
        <text x="754" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">3.20 GB</text>
      </g>

      <!-- Row 5: AI Models -->
      <g transform="translate(0, 276)">
        <rect width="770" height="52" rx="6" fill="#242426" stroke="#2d2d30" stroke-width="1"/>
        <rect x="16" y="18" width="16" height="16" rx="4" fill="#0a84ff"/>
        <path d="M20 26 l2.5 2.5 l5 -5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="28" font-size="13" font-weight="500" fill="#ffffff">HuggingFace Hub Cache</text>
        <text x="44" y="42" font-size="11" fill="#71717a">Snapshot model weights and tokenizer configs</text>
        <text x="490" y="32" font-size="11" font-family="monospace" fill="#8e8e93">~/.cache/huggingface</text>
        <text x="754" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">4.10 GB</text>
      </g>

      <!-- Row 6: Google Chrome -->
      <g transform="translate(0, 336)">
        <rect width="770" height="52" rx="6" fill="#242426" stroke="#2d2d30" stroke-width="1"/>
        <rect x="16" y="18" width="16" height="16" rx="4" fill="#0a84ff"/>
        <path d="M20 26 l2.5 2.5 l5 -5" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <text x="44" y="28" font-size="13" font-weight="500" fill="#ffffff">Google Chrome Cache</text>
        <text x="44" y="42" font-size="11" fill="#71717a">Web disk cache, code cache, and media cache</text>
        <text x="490" y="32" font-size="11" font-family="monospace" fill="#8e8e93">~/Library/Caches/Google/Chrome</text>
        <text x="754" y="33" font-size="13" font-weight="600" fill="#ffffff" text-anchor="end">1.40 GB</text>
      </g>
    </g>

    <!-- Bottom Footer Notice -->
    <g transform="translate(305, 626)">
      <text x="0" y="10" font-size="11" fill="#71717a">
        Items will be moved to macOS Trash. Restorable anytime before emptying trash.
      </text>
      <text x="770" y="10" font-size="11" font-weight="500" fill="#0a84ff" text-anchor="end">
        Preferences &amp; Whitelist →
      </text>
    </g>

  </g>
</svg>
