<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Terminal Window Glass -->
    <linearGradient id="termWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="termShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#38bdf8" flood-opacity="0.12"/>
    </filter>

    <clipPath id="termClip">
      <rect x="50" y="30" width="900" height="560" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="620" fill="url(#termBg)"/>

  <!-- Radial Glow Behind Terminal -->
  <circle cx="500" cy="300" r="380" fill="#38bdf8" fill-opacity="0.06"/>

  <!-- Terminal Window Frame -->
  <g filter="url(#termShadow)">
    <rect x="50" y="30" width="900" height="560" rx="14" ry="14" fill="url(#termWindow)" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>
  </g>

  <!-- Terminal Contents (Clipped) -->
  <g clip-path="url(#termClip)">
    
    <!-- Terminal Titlebar -->
    <rect x="50" y="30" width="900" height="42" fill="#0b1120"/>
    <line x1="50" y1="72" x2="950" y2="72" stroke="#1e293b" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="76" cy="51" r="6" fill="#ff5f56"/>
    <circle cx="96" cy="51" r="6" fill="#ffbd2e"/>
    <circle cx="116" cy="51" r="6" fill="#27c93f"/>

    <!-- Terminal Window Title -->
    <text x="500" y="56" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">
      sweep — 92×32
    </text>

    <!-- Terminal Body (Monospace) -->
    <g font-family="'SF Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12.5" letter-spacing="0.2">

      <!-- Shell Prompt -->
      <text x="80" y="112" fill="#10b981" font-weight="700">➜</text>
      <text x="96" y="112" fill="#38bdf8" font-weight="600">~</text>
      <text x="114" y="112" fill="#f8fafc" font-weight="600">sweep clean --dry-run</text>

      <!-- CleanSweep Banner -->
      <text x="80" y="146" font-size="13" font-weight="700" fill="#38bdf8">🧹 CleanSweep</text>
      <text x="195" y="146" font-size="12" fill="#64748b">— The zero-telemetry macOS optimizer</text>

      <!-- Section Title -->
      <text x="80" y="182" fill="#f8fafc" font-weight="700">Detected System &amp; Developer Data:</text>
      <text x="360" y="182" fill="#f59e0b" font-weight="700">31.33 GB</text>
      <text x="428" y="182" fill="#94a3b8">across 15 targets</text>

      <!-- Target List Rows -->
      <!-- 1 -->
      <text x="80" y="214" fill="#38bdf8">•</text>
      <text x="96" y="214" fill="#f1f5f9">User Application Caches</text>
      <rect x="330" y="202" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="215" font-size="11" fill="#94a3b8" text-anchor="middle">System &amp; Junk</text>
      <text x="540" y="214" fill="#10b981" font-weight="600">6.49 GB</text>

      <!-- 2 -->
      <text x="80" y="238" fill="#38bdf8">•</text>
      <text x="96" y="238" fill="#f1f5f9">Google Chrome Cache</text>
      <rect x="330" y="226" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="239" font-size="11" fill="#94a3b8" text-anchor="middle">Browsers</text>
      <text x="540" y="238" fill="#10b981" font-weight="600">1.40 GB</text>

      <!-- 3 -->
      <text x="80" y="262" fill="#38bdf8">•</text>
      <text x="96" y="262" fill="#f1f5f9">Arc Browser Cache</text>
      <rect x="330" y="250" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="263" font-size="11" fill="#94a3b8" text-anchor="middle">Browsers</text>
      <text x="540" y="262" fill="#10b981" font-weight="600">804.10 MB</text>

      <!-- 4 -->
      <text x="80" y="286" fill="#38bdf8">•</text>
      <text x="96" y="286" fill="#f1f5f9">npm Cache (_cacache)</text>
      <rect x="330" y="274" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="287" font-size="11" fill="#94a3b8" text-anchor="middle">Developer</text>
      <text x="540" y="286" fill="#10b981" font-weight="600">4.94 GB</text>

      <!-- 5 -->
      <text x="80" y="310" fill="#38bdf8">•</text>
      <text x="96" y="310" fill="#f1f5f9">uv Python Cache</text>
      <rect x="330" y="298" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="311" font-size="11" fill="#94a3b8" text-anchor="middle">Developer</text>
      <text x="540" y="310" fill="#10b981" font-weight="600">3.05 GB</text>

      <!-- 6 -->
      <text x="80" y="334" fill="#38bdf8">•</text>
      <text x="96" y="334" fill="#f1f5f9">Gradle Cache</text>
      <rect x="330" y="322" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="335" font-size="11" fill="#94a3b8" text-anchor="middle">Developer</text>
      <text x="540" y="334" fill="#10b981" font-weight="600">3.20 GB</text>

      <!-- 7 -->
      <text x="80" y="358" fill="#38bdf8">•</text>
      <text x="96" y="358" fill="#f1f5f9">Homebrew Downloads</text>
      <rect x="330" y="346" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="359" font-size="11" fill="#94a3b8" text-anchor="middle">Developer</text>
      <text x="540" y="358" fill="#10b981" font-weight="600">614.53 MB</text>

      <!-- 8 -->
      <text x="80" y="382" fill="#38bdf8">•</text>
      <text x="96" y="382" fill="#f1f5f9">HuggingFace Hub Cache</text>
      <rect x="330" y="370" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="383" font-size="11" fill="#94a3b8" text-anchor="middle">AI Models</text>
      <text x="540" y="382" fill="#10b981" font-weight="600">4.10 GB</text>

      <!-- 9 -->
      <text x="80" y="406" fill="#38bdf8">•</text>
      <text x="96" y="406" fill="#f1f5f9">Ollama Model Blobs</text>
      <rect x="330" y="394" width="130" height="18" rx="4" fill="#1e293b"/>
      <text x="395" y="407" font-size="11" fill="#94a3b8" text-anchor="middle">AI Models</text>
      <text x="540" y="406" fill="#10b981" font-weight="600">3.12 GB</text>

      <!-- Divider -->
      <line x1="80" y1="428" x2="680" y2="428" stroke="#334155" stroke-opacity="0.5" stroke-dasharray="4 4"/>

      <!-- Dry Run Execution -->
      <text x="80" y="454" fill="#f59e0b" font-weight="700">[DRY RUN]</text>
      <text x="160" y="454" fill="#f1f5f9">Simulating Clean without touching live files...</text>

      <!-- Success Result -->
      <g transform="translate(80, 480)">
        <rect width="600" height="38" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
        <text x="20" y="24" fill="#34d399" font-weight="700">✓ Done!</text>
        <text x="85" y="24" fill="#f8fafc">[Dry Run] Successfully simulated clean of <tspan fill="#38bdf8" font-weight="700">15 items</tspan> (<tspan fill="#34d399" font-weight="700">31.33 GB</tspan> reclaimable).</text>
      </g>

      <!-- Next Prompt -->
      <text x="80" y="546" fill="#10b981" font-weight="700">➜</text>
      <text x="96" y="546" fill="#38bdf8" font-weight="600">~</text>
      <rect x="114" y="534" width="8" height="16" fill="#38bdf8" fill-opacity="0.8"/>
    </g>

  </g>
</svg>
