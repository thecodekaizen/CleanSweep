<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <!-- Terminal Window Shadow -->
    <filter id="cliWindowShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <clipPath id="cliClip">
      <rect x="40" y="30" width="880" height="520" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Neutral Canvas Background -->
  <rect width="960" height="580" fill="#121214"/>

  <!-- Terminal Window Frame -->
  <g filter="url(#cliWindowShadow)">
    <rect x="40" y="30" width="880" height="520" rx="10" ry="10" fill="#18181a" stroke="#2e2e32" stroke-width="1"/>
  </g>

  <!-- Terminal Contents -->
  <g clip-path="url(#cliClip)">
    
    <!-- Titlebar -->
    <rect x="40" y="30" width="880" height="38" fill="#1f1f22"/>
    <line x1="40" y1="68" x2="920" y2="68" stroke="#2a2a2e" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="62" cy="49" r="5.5" fill="#ff5f57"/>
    <circle cx="80" cy="49" r="5.5" fill="#febc2e"/>
    <circle cx="98" cy="49" r="5.5" fill="#28c840"/>

    <!-- Title -->
    <text x="480" y="53" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500" fill="#8e8e93" text-anchor="middle">
      vishnu@MacBook-Pro: ~ (zsh)
    </text>

    <!-- Terminal Output (SF Mono / JetBrains Mono) -->
    <g font-family="'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace" font-size="12" fill="#d4d4d8" letter-spacing="0.1">

      <!-- Command Prompt -->
      <g transform="translate(68, 102)">
        <text x="0" y="0" fill="#10b981" font-weight="600">vishnu@MacBook-Pro</text>
        <text x="140" y="0" fill="#71717a">:</text>
        <text x="152" y="0" fill="#60a5fa" font-weight="600">~</text>
        <text x="168" y="0" fill="#71717a">%</text>
        <text x="184" y="0" fill="#ffffff" font-weight="600">sweep clean --dry-run</text>
      </g>

      <!-- Clean Header -->
      <text x="68" y="132" fill="#71717a">CleanSweep 1.0.0 (darwin-arm64) • Scanning system &amp; developer caches...</text>

      <!-- Table Header -->
      <text x="68" y="166" fill="#a1a1aa" font-weight="600">CATEGORY</text>
      <text x="210" y="166" fill="#a1a1aa" font-weight="600">TARGET</text>
      <text x="400" y="166" fill="#a1a1aa" font-weight="600">PATH</text>
      <text x="850" y="166" fill="#a1a1aa" font-weight="600" text-anchor="end">RECLAIMABLE</text>

      <!-- Table Divider -->
      <line x1="68" y1="176" x2="850" y2="176" stroke="#333336" stroke-width="1"/>

      <!-- Table Rows -->
      <g transform="translate(68, 196)">
        <text x="0" y="0" fill="#8e8e93">System</text>
        <text x="142" y="0" fill="#ffffff">User Caches</text>
        <text x="332" y="0" fill="#71717a">~/Library/Caches</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">6.49 GB</text>
      </g>

      <g transform="translate(68, 220)">
        <text x="0" y="0" fill="#8e8e93">Browsers</text>
        <text x="142" y="0" fill="#ffffff">Google Chrome</text>
        <text x="332" y="0" fill="#71717a">~/Library/Caches/Google/Chrome</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">1.40 GB</text>
      </g>

      <g transform="translate(68, 244)">
        <text x="0" y="0" fill="#8e8e93">Browsers</text>
        <text x="142" y="0" fill="#ffffff">Arc Browser</text>
        <text x="332" y="0" fill="#71717a">~/Library/Caches/company.thebrowser</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">804.10 MB</text>
      </g>

      <g transform="translate(68, 268)">
        <text x="0" y="0" fill="#8e8e93">Developer</text>
        <text x="142" y="0" fill="#ffffff">npm Global Cache</text>
        <text x="332" y="0" fill="#71717a">~/.npm/_cacache</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">4.94 GB</text>
      </g>

      <g transform="translate(68, 292)">
        <text x="0" y="0" fill="#8e8e93">Developer</text>
        <text x="142" y="0" fill="#ffffff">uv Python Cache</text>
        <text x="332" y="0" fill="#71717a">~/.cache/uv</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">3.05 GB</text>
      </g>

      <g transform="translate(68, 316)">
        <text x="0" y="0" fill="#8e8e93">Developer</text>
        <text x="142" y="0" fill="#ffffff">Gradle Cache</text>
        <text x="332" y="0" fill="#71717a">~/.gradle/caches</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">3.20 GB</text>
      </g>

      <g transform="translate(68, 340)">
        <text x="0" y="0" fill="#8e8e93">Developer</text>
        <text x="142" y="0" fill="#ffffff">Homebrew Downloads</text>
        <text x="332" y="0" fill="#71717a">~/Library/Caches/Homebrew</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">614.53 MB</text>
      </g>

      <g transform="translate(68, 364)">
        <text x="0" y="0" fill="#8e8e93">AI Models</text>
        <text x="142" y="0" fill="#ffffff">HuggingFace Hub</text>
        <text x="332" y="0" fill="#71717a">~/.cache/huggingface</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">4.10 GB</text>
      </g>

      <g transform="translate(68, 388)">
        <text x="0" y="0" fill="#8e8e93">AI Models</text>
        <text x="142" y="0" fill="#ffffff">Ollama Models</text>
        <text x="332" y="0" fill="#71717a">~/.ollama/models</text>
        <text x="782" y="0" fill="#32d74b" font-weight="600" text-anchor="end">3.12 GB</text>
      </g>

      <!-- Bottom Table Line -->
      <line x1="68" y1="408" x2="850" y2="408" stroke="#333336" stroke-width="1"/>

      <!-- Summary -->
      <g transform="translate(68, 432)">
        <text x="0" y="0" fill="#ffffff" font-weight="600">Total reclaimable space:</text>
        <text x="210" y="0" fill="#32d74b" font-weight="700">31.33 GB</text>
        <text x="288" y="0" fill="#71717a">across 15 targets</text>
      </g>

      <g transform="translate(68, 458)">
        <text x="0" y="0" fill="#ffd60a" font-weight="600">[dry-run]</text>
        <text x="80" y="0" fill="#a1a1aa">Simulated scan completed in 184ms. 0 files modified or removed.</text>
      </g>

      <!-- Next Prompt -->
      <g transform="translate(68, 498)">
        <text x="0" y="0" fill="#10b981" font-weight="600">vishnu@MacBook-Pro</text>
        <text x="140" y="0" fill="#71717a">:</text>
        <text x="152" y="0" fill="#60a5fa" font-weight="600">~</text>
        <text x="168" y="0" fill="#71717a">%</text>
        <rect x="184" y="-12" width="7" height="14" fill="#a1a1aa" fill-opacity="0.8"/>
      </g>

    </g>
  </g>
</svg>
