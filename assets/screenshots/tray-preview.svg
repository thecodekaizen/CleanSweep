<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <!-- Menu Drop Shadow -->
    <filter id="macMenuShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <clipPath id="menuClip">
      <rect width="250" height="250" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <!-- Neutral Dark Canvas -->
  <rect width="600" height="340" fill="#121214"/>

  <!-- macOS Top Menu Bar -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    <rect x="0" y="0" width="600" height="32" fill="#18181b"/>
    <line x1="0" y1="32" x2="600" y2="32" stroke="#27272a" stroke-width="1"/>

    <!-- Left System Items -->
    <text x="18" y="21" font-size="14" fill="#ffffff"></text>
    <text x="38" y="20" font-size="13" font-weight="600" fill="#ffffff">CleanSweep</text>
    <text x="124" y="20" font-size="13" fill="#a1a1aa">File</text>
    <text x="160" y="20" font-size="13" fill="#a1a1aa">Edit</text>
    <text x="196" y="20" font-size="13" fill="#a1a1aa">View</text>
    <text x="238" y="20" font-size="13" fill="#a1a1aa">Window</text>

    <!-- Right System Items -->
    <g transform="translate(480, 10)">
      <!-- Wi-Fi -->
      <path d="M0 12 a6 6 0 0 1 12 0 M2 9 a9 9 0 0 1 8 0 M4 6 a12 12 0 0 1 4 0" stroke="#a1a1aa" stroke-width="1.2" fill="none"/>
      <!-- Battery -->
      <rect x="24" y="2" width="18" height="10" rx="2" stroke="#a1a1aa" stroke-width="1" fill="none"/>
      <rect x="42" y="5" width="2" height="4" rx="1" fill="#a1a1aa"/>
      <rect x="26" y="4" width="14" height="6" rx="1" fill="#32d74b"/>
      <!-- Time -->
      <text x="56" y="10" font-size="12" fill="#ffffff">Sun 17:35</text>
    </g>

    <!-- CleanSweep Menu Bar Tray Item (Active) -->
    <g transform="translate(370, 3)">
      <rect width="95" height="26" rx="5" fill="#27272a"/>
      <!-- Broom Icon -->
      <path d="M12 18 l-4 -4 m2 2 l-4 -4 m6 4 l-4 -4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="16" cy="6" r="1.5" fill="#ffffff"/>
      <!-- Free RAM Text -->
      <text x="24" y="17" font-size="12" font-weight="500" fill="#ffffff">14.2 GB</text>
    </g>

    <!-- Dropdown Menu -->
    <g transform="translate(330, 38)" filter="url(#macMenuShadow)">
      <!-- Menu Background -->
      <rect width="250" height="250" rx="8" ry="8" fill="#1f1f22" stroke="#333336" stroke-width="1"/>

      <!-- Menu Items -->
      <!-- App Header -->
      <g transform="translate(14, 24)">
        <text x="0" y="0" font-size="12" font-weight="600" fill="#ffffff">CleanSweep 1.0.0</text>
        <text x="0" y="18" font-size="11" fill="#71717a">Memory: 9.8 GB used / 24 GB (41%)</text>
        <rect x="0" y="26" width="222" height="4" rx="2" fill="#2e2e32"/>
        <rect x="0" y="26" width="91" height="4" rx="2" fill="#0a84ff"/>
      </g>

      <!-- Separator 1 -->
      <line x1="8" y1="68" x2="242" y2="68" stroke="#2e2e32" stroke-width="1"/>

      <!-- Open CleanSweep (Hover Highlight) -->
      <g transform="translate(6, 76)">
        <rect width="238" height="26" rx="5" fill="#0a84ff"/>
        <text x="10" y="17" font-size="13" font-weight="500" fill="#ffffff">Open CleanSweep</text>
        <text x="228" y="17" font-size="11" fill="#ffffff" fill-opacity="0.8" text-anchor="end">⌘O</text>
      </g>

      <!-- Quick Clean -->
      <g transform="translate(6, 108)">
        <text x="10" y="18" font-size="13" fill="#ffffff">Quick Clean (Flush RAM &amp; DNS)</text>
      </g>

      <!-- Separator 2 -->
      <line x1="8" y1="140" x2="242" y2="140" stroke="#2e2e32" stroke-width="1"/>

      <!-- Launch at Login -->
      <g transform="translate(6, 148)">
        <text x="10" y="18" font-size="13" fill="#d4d4d8">Launch at Login</text>
        <text x="228" y="18" font-size="12" fill="#32d74b" font-weight="600" text-anchor="end">✓</text>
      </g>

      <!-- Automated Schedule Status -->
      <g transform="translate(6, 178)">
        <text x="10" y="18" font-size="13" fill="#d4d4d8">Schedule: Daily Active</text>
      </g>

      <!-- Separator 3 -->
      <line x1="8" y1="208" x2="242" y2="208" stroke="#2e2e32" stroke-width="1"/>

      <!-- Quit -->
      <g transform="translate(6, 216)">
        <text x="10" y="18" font-size="13" fill="#ff453a">Quit CleanSweep</text>
        <text x="228" y="18" font-size="11" fill="#71717a" text-anchor="end">⌘Q</text>
      </g>
    </g>

  </g>
</svg>
