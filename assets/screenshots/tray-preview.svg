<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="trayCanvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>

    <!-- Glass Dropdown Background -->
    <linearGradient id="menuGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Menu Drop Shadow -->
    <filter id="menuShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="650" height="360" fill="url(#trayCanvasBg)"/>

  <!-- Radial Glow Behind Menu -->
  <circle cx="340" cy="180" r="180" fill="#38bdf8" fill-opacity="0.08"/>

  <!-- macOS Menu Bar Strip -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    <rect x="0" y="0" width="650" height="36" fill="#0b1120" fill-opacity="0.9"/>
    <line x1="0" y1="36" x2="650" y2="36" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Left Apple Logo & App Menu -->
    <text x="24" y="23" font-size="14" fill="#f8fafc"></text>
    <text x="48" y="23" font-size="13" font-weight="600" fill="#f8fafc">CleanSweep</text>
    <text x="140" y="23" font-size="13" fill="#94a3b8">File</text>
    <text x="180" y="23" font-size="13" fill="#94a3b8">Edit</text>
    <text x="220" y="23" font-size="13" fill="#94a3b8">View</text>
    <text x="265" y="23" font-size="13" fill="#94a3b8">Window</text>

    <!-- Right Tray Status Items -->
    <!-- Wi-Fi & Battery -->
    <text x="560" y="23" font-size="13" fill="#cbd5e1">􀙇</text>
    <text x="590" y="23" font-size="13" fill="#cbd5e1">94%</text>
    <text x="620" y="23" font-size="13" fill="#cbd5e1">􀛨</text>

    <!-- CleanSweep Active Menu Bar Pill (Highlighted) -->
    <rect x="420" y="4" width="115" height="28" rx="6" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Broom Icon in Menu Bar -->
    <g transform="translate(430, 9)" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="m11 15-5-5"/>
      <path d="M8 12 3 7"/>
      <path d="m14 9-5-5"/>
      <path d="M11 6 6 1"/>
      <circle cx="13" cy="3" r="1.5" fill="#38bdf8"/>
    </g>

    <!-- Live Free RAM in Menu Bar -->
    <text x="452" y="22" font-size="12" font-weight="600" fill="#f8fafc">14.2 GB</text>

    <!-- Dropdown Menu -->
    <g transform="translate(350, 44)" filter="url(#menuShadow)">
      <!-- Menu Glass Box -->
      <rect width="260" height="270" rx="10" fill="url(#menuGlass)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>

      <!-- Menu Items -->
      <!-- App Header -->
      <text x="18" y="28" font-size="13" font-weight="700" fill="#f8fafc">CleanSweep</text>
      <rect x="200" y="16" width="44" height="16" rx="8" fill="#0284c7" fill-opacity="0.2"/>
      <text x="222" y="28" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">v1.0.0</text>

      <!-- Memory Stats -->
      <text x="18" y="52" font-size="12" fill="#94a3b8">Memory: <tspan fill="#f8fafc" font-weight="600">9.8 GB used</tspan> <tspan fill="#64748b">(41%)</tspan></text>
      
      <!-- Progress Bar -->
      <rect x="18" y="62" width="224" height="5" rx="2.5" fill="#334155"/>
      <rect x="18" y="62" width="92" height="5" rx="2.5" fill="#38bdf8"/>

      <!-- Separator 1 -->
      <line x1="12" y1="80" x2="248" y2="80" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

      <!-- Open App (Hover state) -->
      <rect x="8" y="90" width="244" height="30" rx="6" fill="#0284c7" fill-opacity="0.25"/>
      <text x="20" y="110" font-size="13" font-weight="500" fill="#ffffff">Open CleanSweep</text>
      <text x="238" y="110" font-size="11" fill="#94a3b8" text-anchor="end">⌘O</text>

      <!-- Quick Clean -->
      <text x="20" y="146" font-size="13" font-weight="600" fill="#38bdf8">⚡ Quick Clean (RAM &amp; DNS)</text>
      <text x="20" y="164" font-size="10.5" fill="#64748b">Instant flush without opening app</text>

      <!-- Separator 2 -->
      <line x1="12" y1="180" x2="248" y2="180" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

      <!-- Launch at Login -->
      <text x="20" y="206" font-size="13" font-weight="400" fill="#cbd5e1">Launch at Login</text>
      <text x="234" y="206" font-size="13" fill="#10b981" font-weight="700">✓</text>

      <!-- Automated Schedule Status -->
      <text x="20" y="232" font-size="13" font-weight="400" fill="#cbd5e1">Schedule: <tspan fill="#38bdf8">Daily Active</tspan></text>

      <!-- Separator 3 -->
      <line x1="12" y1="244" x2="248" y2="244" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>

      <!-- Quit -->
      <text x="20" y="260" font-size="13" font-weight="400" fill="#f87171">Quit CleanSweep</text>
      <text x="238" y="260" font-size="11" fill="#64748b" text-anchor="end">⌘Q</text>
    </g>

  </g>
</svg>
